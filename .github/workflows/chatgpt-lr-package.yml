name: chatgpt-lr-package
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  package:
    if: github.head_ref == 'chatgpt-temp-lr-package-20260824'
    runs-on: ubuntu-latest
    steps:
      - name: Download public preset sources
        run: |
          set -e
          mkdir -p out/xdqin out/licenses out/jkost
          curl -L --fail --retry 3 -o out/peva3.zip https://raw.githubusercontent.com/peva3/Lightroom-Presets/v3.1.0/lr-presets-all.xmp.zip
          curl -L --fail --retry 3 -o 'out/xdqin/Autumn Sonata.xmp' 'https://raw.githubusercontent.com/XD-QIN/xdqin_web_data/main/building-film-look-lightroom-presets/presets/Autumn%20Sonata.xmp'
          curl -L --fail --retry 3 -o 'out/xdqin/Green Ray 1986.xmp' 'https://raw.githubusercontent.com/XD-QIN/xdqin_web_data/main/building-film-look-lightroom-presets/presets/Green%20Ray%201986.xmp'
          curl -L --fail --retry 3 -o 'out/xdqin/Hero 2002.xmp' 'https://raw.githubusercontent.com/XD-QIN/xdqin_web_data/main/building-film-look-lightroom-presets/presets/Hero%202002.xmp'
          curl -L --fail --retry 3 -o 'out/xdqin/Pierrot le Fou.xmp' 'https://raw.githubusercontent.com/XD-QIN/xdqin_web_data/main/building-film-look-lightroom-presets/presets/Pierrot%20le%20Fou.xmp'
          curl -L --fail --retry 3 -o out/licenses/peva3-MIT.txt https://raw.githubusercontent.com/peva3/Lightroom-Presets/v3.1.0/LICENSE
          curl -L --fail --retry 3 -o out/licenses/XD-QIN-LICENSE.txt https://raw.githubusercontent.com/XD-QIN/xdqin_web_data/main/LICENSE
          curl -L --fail --retry 3 -o out/jkost/SelectLandscape-2.zip https://jkost.com/blog/wp-content/uploads/2025/04/SelectLandscape-2.zip || true
          unzip -q out/peva3.zip -d out/peva3
          echo "peva3 XMP: $(find out/peva3 -type f -iname '*.xmp' | wc -l)"
          echo "XD-QIN XMP: $(find out/xdqin -type f -iname '*.xmp' | wc -l)"
          ls -lh out/jkost || true
      - name: Upload source bundle
        uses: actions/upload-artifact@v4
        with:
          name: lr-public-preset-sources
          path: out
          retention-days: 1
